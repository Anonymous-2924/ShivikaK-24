# Phase 1 services: Qdrant (vector) + Neo4j Community (graph).
# Ollama is NOT run here — embeddings use a local Ollama you already have,
# extraction uses Ollama Cloud. See .env.example.
#
# Volumes live under ./.volumes (gitignored) so a `docker compose down -v`
# never touches anything else on the host.

services:
  qdrant:
    image: qdrant/qdrant:v1.19.2   # must match qdrant-client 1.19.x in pyproject.toml
    container_name: blastradius-qdrant
    ports:
      - "6333:6333"   # REST + web UI
      - "6334:6334"   # gRPC
    volumes:
      - ./.volumes/qdrant:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 3s
      retries: 5

  neo4j:
    image: neo4j:5.26.32-community   # 5.x LTS line; neo4j python driver 6.x talks to it
    container_name: blastradius-neo4j
    ports:
      - "7474:7474"   # HTTP / Browser
      - "7687:7687"   # Bolt
    environment:
      # Password is read from .env. Compose fails if NEO4J_PASSWORD is unset,
      # which is intentional — no default password in a project that will
      # eventually hold real supply-chain data.
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
    volumes:
      - ./.volumes/neo4j/data:/data
      - ./.volumes/neo4j/logs:/logs
      - ./.volumes/neo4j/plugins:/plugins
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p $${NEO4J_PASSWORD} 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
